def getProperties(String fileName) {
    final Properties properties = new Properties()
    def file = file(fileName)
    if (file.exists()) {
        file.withInputStream { stream -> properties.load(stream) }
    }
    return properties
}

static def getProperty(Properties properties, String name) {
    return properties.getProperty(name) ?: "$name missing"
}

// Release signing is read from keystore.properties in the repo root (store, alias, storePass, pass). Debug builds
// do not need it; any release packaging task fails up front if it is missing or incomplete.
def keystoreProperties = getProperties('../keystore.properties')
def keystoreProblem = null
if (!file('../keystore.properties').exists()) {
    keystoreProblem = "keystore.properties is missing from the repo root"
} else {
    def missingKeys = ['store', 'alias', 'storePass', 'pass'].findAll { !keystoreProperties.getProperty(it) }
    if (!missingKeys.isEmpty()) {
        keystoreProblem = "keystore.properties has no value for: ${missingKeys.join(', ')}"
    } else if (!file(keystoreProperties.getProperty('store')).exists()) {
        keystoreProblem = "the keystore '${keystoreProperties.getProperty('store')}' named in keystore.properties does not exist (paths are relative to app/)"
    }
}
def hasKeystore = keystoreProblem == null

gradle.taskGraph.whenReady { graph ->
    if (!hasKeystore) {
        def releaseTasks = graph.allTasks.findAll { it.project == project && it.name ==~ /^(assemble|bundle|package|sign|install)\w*Release$/ }
        if (!releaseTasks.isEmpty()) {
            throw new GradleException("Cannot build a signed release (${releaseTasks*.name.join(', ')}): $keystoreProblem. " +
                    "Provide keystore.properties with store, alias, storePass and pass.")
        }
    }
}

android {
    namespace 'com.simplecity.amp_library'

    compileSdkVersion Dependencies.compileSdk

    defaultConfig {
        minSdkVersion Dependencies.minSdk
        targetSdkVersion Dependencies.targetSdk

        versionName Config.versionName
        versionCode 5902

        resConfigs "en", "zh-rCN", "fr", "de", "ko", "it", "ru", "nl", "tr", "pl", "ro", "hu", "hi-rIN", "uk", "bg-rBG", "en-rGB", "et-rEE", "vi", "pt-rBR", "es", "en-rNZ", "zh-rTW", "es-rES", "ca", "hr", "en-rAU", "eu-rES", "th", "ja"

        renderscriptTargetApi 23

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // This API key is provided for convenience. Please go to https://www.last.fm/api/account/create and create your own.
        buildConfigField("String", "LASTFM_API_KEY", "\"${getProperty(getProperties('../public.properties'), 'LASTFM_API_KEY')}\"")
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile file(getProperty(keystoreProperties, 'store'))
                keyAlias getProperty(keystoreProperties, 'alias')
                storePassword getProperty(keystoreProperties, 'storePass')
                keyPassword getProperty(keystoreProperties, 'pass')
            }
        }
    }

    buildTypes {

        debug {
            applicationIdSuffix ".debug"
        }

        release {

            minifyEnabled true
            shrinkResources true

            // For further optimisation, use 'proguard-android-optimize.txt' instead of 'proguard-android.txt'.
            // Last time I checked, it reduced by another ~5000 methods.
            proguardFiles getDefaultProguardFile('proguard-android.txt'), file('proguard-rules.pro')
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }

            buildConfigField("String", "LASTFM_API_KEY", "\"${getProperty(getProperties('../private.properties'), 'LASTFM_API_KEY')}\"")
        }
    }

    // Ignore useless variants, such as devRelease.
    variantFilter { variant ->

        def names = variant.flavors*.name
        def buildTypes = variant.buildType*.name

        def debugFilters = ["amazonPaid", "amazonFree"]
        def relFilters = ["dev"]

        def filter = { name -> names.contains(name) }
        def debugIgnore = buildTypes.contains("debug") && debugFilters.stream().anyMatch(filter)
        def releaseIgnore = buildTypes.contains("release") && relFilters.stream().anyMatch(filter)

        setIgnore(debugIgnore || releaseIgnore)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
        renderScript true
        aidl true
    }

    flavorDimensions "all"

    productFlavors {

        dev {
            dimension "all"

            applicationId "com.simplecity.amp_pro"

            resConfigs "en", "xxhdpi"
        }

        paid {
            dimension "all"
            applicationId "com.simplecity.amp_pro"
        }

        free {
            dimension "all"
            applicationId "another.music.player"
        }

        amazonPaid {
            dimension "all"
            applicationId "com.simplecity.amp_pro"
        }

        amazonFree {
            dimension "all"
            applicationId "another.music.player"
        }
    }

    sourceSets {
        main.aidl.srcDirs = ['src/main/java']

        dev.res.srcDirs = ['src/paid/res']
        dev.java.srcDirs = ['src/paid/java']

        paid.res.srcDirs = ['src/paid/res']
        paid.java.srcDirs = ['src/paid/java']

        free.manifest.srcFile 'src/free/AndroidManifest.xml'
        free.res.srcDirs = ['src/free/res']
        free.java.srcDirs = ['src/free/java']

        amazonPaid.res.srcDirs = ['src/paid/res']
        amazonPaid.java.srcDirs = ['src/paid/java']

        amazonFree.res.srcDirs = ['src/free/res']
        amazonFree.java.srcDirs = ['src/free/java']
    }

    lint {
        disable 'ExtraTranslation', 'MissingTranslation'
        abortOnError false
    }

    packaging {
        resources {
            excludes += 'META-INF/rxjava.properties'
        }
    }
}

